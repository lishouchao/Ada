[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-agent"
version = "0.1.0"
description = "Ada - NebulaOS Intelligent Assistant"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ada*"]
