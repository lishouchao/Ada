[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-assistant"
version = "0.1.0"
description = "Ada - OS-integrated AI assistant for NebulaOS"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nebula Team", email = "team@nebula.org"}
]
maintainers = [
    {name = "Nebula Team", email = "team@nebula.org"}
]
keywords = [
    "ai",
    "assistant",
    "desktop",
    "gnome",
    "linux",
    "accessibility",
    "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: Gnome",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

dependencies = [
    # Core
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",

    # Async
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",

    # LLM
    "httpx>=0.25.0",
    "openai>=1.0.0",

    # Vector storage
    "chromadb>=0.4.0",
    "numpy>=1.24.0",

    # GTK/GNOME
    "pygobject>=3.46.0",

    # D-Bus
    "dbus-python>=1.3.0",

    # AT-SPI
    "pyatspi>=2.46.0",

    # OCR (optional)
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",

    # Utilities
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML",
    "types-redis",
]
ollama = [
    "ollama>=0.1.0",
]
all = [
    "ada-assistant[dev,ollama]",
]

[project.scripts]
ada = "ada.cli:main"
ada-daemon = "ada.daemon:main"

[project.gui-scripts]
ada-gui = "ada.ui.app:main"

[project.urls]
Homepage = "https://github.com/nebula/ada"
Documentation = "https://github.com/nebula/ada#readme"
Repository = "https://github.com/nebula/ada.git"
Issues = "https://github.com/nebula/ada/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["ada", "ada.core", "ada.skill", "ada.skill.builtin", "ada.memory", "ada.intent", "ada.events", "ada.ui", "ada.cli"]

[tool.setuptools.package-data]
ada = ["py.typed", "*.yaml", "*.json"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without strict
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "gi.*",
    "dbus.*",
    "pyatspi.*",
    "chromadb.*",
    "PIL.*",
    "pytesseract.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ada"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
