# Ada Configuration
# Main configuration file for Ada AI Assistant

# Agent settings
agent:
  name: "Ada"
  version: "0.1.0"

  # Operation mode: normal, focus, automation
  mode: normal

  # Language settings
  language: zh-CN
  fallback_language: en-US

  # Response settings
  response:
    max_length: 1000
    include_context: true
    stream_responses: true

# ============================================================
# LLM Settings
# ============================================================
llm:
  # Current active provider (select from: ollama, openai, anthropic, google,
  # aliyun, baidu, zhipu, moonshot, deepseek, siliconflow, etc.)
  provider: ollama

  # Default model for the active provider
  model: qwen2.5:latest

  # Generation parameters
  params:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 4096

  # Embedding settings
  embedding:
    provider: ollama
    model: nomic-embed-text:latest
    dimension: 768

  # ============================================================
  # Provider Configurations
  # ============================================================

  # Local - Ollama (default)
  ollama:
    base_url: http://localhost:11434
    timeout: 120
    model: qwen2.5:latest
    embedding_model: nomic-embed-text:latest

  # Local - vLLM
  vllm:
    base_url: http://localhost:8000/v1
    model: ""  # Specify your model

  # ============================================================
  # International Providers
  # ============================================================

  # OpenAI (GPT-4, GPT-3.5)
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    embedding_model: text-embedding-3-small
    timeout: 60

  # Anthropic (Claude)
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4-20250514
    timeout: 120

  # Google AI (Gemini)
  google:
    api_key: ${GOOGLE_API_KEY}
    model: gemini-2.0-flash
    embedding_model: text-embedding-004
    timeout: 60

  # Azure OpenAI
  azure:
    api_key: ${AZURE_OPENAI_API_KEY}
    base_url: ${AZURE_OPENAI_ENDPOINT}
    api_version: "2024-02-15-preview"
    model: gpt-4o
    deployment: gpt-4o

  # ============================================================
  # Chinese (Domestic) Providers
  # ============================================================

  # 阿里云通义千问 (Alibaba Qwen)
  aliyun:
    api_key: ${ALIYUN_API_KEY}
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    embedding_model: text-embedding-v3
    timeout: 60

  # 百度文心一言 (Baidu ERNIE)
  baidu:
    api_key: ${BAIDU_API_KEY}
    secret_key: ${BAIDU_SECRET_KEY}
    model: ernie-4.0-8k
    embedding_model: Embedding-V1
    timeout: 60

  # 智谱AI (GLM)
  zhipu:
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4-flash
    embedding_model: embedding-3
    timeout: 60

  # 月之暗面 (Moonshot Kimi)
  moonshot:
    api_key: ${MOONSHOT_API_KEY}
    base_url: https://api.moonshot.cn/v1
    model: moonshot-v1-8k
    timeout: 60

  # 讯飞星火 (iFlytek Spark)
  xfyun:
    app_id: ${XFYUN_APP_ID}
    api_key: ${XFYUN_API_KEY}
    api_secret: ${XFYUN_API_SECRET}
    model: generalv3.5
    timeout: 60

  # 百川智能 (Baichuan)
  baichuan:
    api_key: ${BAICHUAN_API_KEY}
    base_url: https://api.baichuan-ai.com/v1
    model: Baichuan4
    timeout: 60

  # MiniMax
  minimax:
    api_key: ${MINIMAX_API_KEY}
    group_id: ${MINIMAX_GROUP_ID}
    base_url: https://api.minimax.chat/v1
    model: abab6.5s-chat
    embedding_model: embo-01
    timeout: 60

  # DeepSeek (深度求索)
  deepseek:
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    timeout: 60

  # SiliconFlow (硅基流动)
  siliconflow:
    api_key: ${SILICONFLOW_API_KEY}
    base_url: https://api.siliconflow.cn/v1
    model: Qwen/Qwen2.5-72B-Instruct
    embedding_model: BAAI/bge-large-zh-v1.5
    timeout: 60

# ============================================================
# Memory Settings
# ============================================================
memory:
  # Storage backend: sqlite, chromadb
  backend: sqlite

  # Database path
  database_path: ~/.local/share/ada/memory.db

  # Vector store settings
  vector:
    enabled: true
    backend: chromadb
    persist_directory: ~/.local/share/ada/vectors

  # Retention settings
  retention:
    conversation_days: 30
    semantic_days: 90
    max_memories: 10000

  # Importance threshold for long-term storage
  importance_threshold: 0.6

# ============================================================
# Skill Settings
# ============================================================
skills:
  # Skill directories
  directories:
    - ~/.local/share/ada/skills
    - /usr/share/ada/skills

  # Auto-discover skills
  auto_discover: true

  # Skill permissions
  default_permission: ask  # ask, allow, deny

  # Builtin skills
  builtin:
    - file.organizer
    - app.launcher
    - system.control
    - web.search
    - calendar.reminder
    - clipboard.manager

# ============================================================
# Perception Settings
# ============================================================
perception:
  # AT-SPI monitoring
  atspi:
    enabled: true
    monitor_events: true
    events:
      - focus
      - window:activate
      - object:state-changed

  # Screen capture
  screen:
    enabled: true
    ocr_enabled: true
    ocr_language: eng+chi_sim

  # UI tree cache
  cache_ttl: 5  # seconds

# ============================================================
# Execution Settings
# ============================================================
execution:
  # Execution path priority: api > dbus > cli > gui
  backends:
    api:
      enabled: true
      priority: 10
    dbus:
      enabled: true
      priority: 20
    cli:
      enabled: true
      priority: 30
    gui:
      enabled: true
      priority: 40

  # Timeout settings
  default_timeout: 30
  max_timeout: 300

  # Sandboxing
  sandbox:
    enabled: true
    network: false
    read_only_paths:
      - /usr
      - /lib
      - /etc/ssl

# ============================================================
# Security Settings
# ============================================================
security:
  # Permission mode: permissive, balanced, strict
  mode: balanced

  # Confirmation settings
  destructive_actions_require_confirmation: true
  system_actions_require_confirmation: true

  # Audit logging
  audit_log: true
  audit_path: ~/.local/share/ada/audit.log

# ============================================================
# UI Settings
# ============================================================
ui:
  # Notification settings
  notifications:
    enabled: true
    position: top-right
    timeout: 5000

  # GNOME Shell extension
  extension:
    enabled: true
    shortcut: <Super>a

  # GTK theme
  theme: Adwaita
  dark_mode: true

# ============================================================
# D-Bus Settings
# ============================================================
dbus:
  service_name: org.nebula.Ada
  object_path: /org/nebula/Ada

  # Allow external connections
  allow_external: false

# ============================================================
# Logging Settings
# ============================================================
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # File logging
  file:
    enabled: true
    path: ~/.local/share/ada/ada.log
    max_size: 10MB
    backup_count: 5

  # Console logging
  console:
    enabled: true
    colorize: true

# ============================================================
# Performance Settings
# ============================================================
performance:
  # Cache settings
  cache:
    enabled: true
    max_size: 100MB

  # Async workers
  workers: 4

  # Rate limiting
  rate_limit:
    requests_per_minute: 60
    tokens_per_minute: 10000
